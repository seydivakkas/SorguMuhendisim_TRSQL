name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,api]"
      - name: G1 — Lint & format
        run: |
          ruff check .
          ruff format --check .
      - name: G2 — Type check
        run: mypy
      - name: G3 — Module boundaries
        run: python tools/check_boundaries.py
      - name: G4 — Security tests
        run: pytest -m security -q
      - name: G5 — Full test suite
        run: pytest -q --cov=backend --cov-report=term-missing
