[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trsql"
version = "0.2.0"
description = "TRSQL — Türkçe doğal dil ile kurumsal veritabanları arasında güvenli, açıklanabilir ve yerel çalışan veri erişim platformu"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "sqlglot>=25,<31",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "httpx>=0.27"]
llm = ["llama-cpp-python>=0.3", "huggingface-hub>=0.24"]
rag = ["rank-bm25>=0.2.2", "faiss-cpu>=1.8", "datasketch>=1.6", "numpy>=1.26"]
postgres = ["psycopg[binary]>=3.1"]
synthetic = ["faker>=24"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["boundaries.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "security: security gate tests (must never be skipped)",
  "integration: end-to-end tests against a local SQLite database",
  "gpu: tests requiring a local CUDA GPU and downloaded GGUF model weights",
  "postgres: tests requiring a running PostgreSQL server",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["frontend", "experiments", "research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Turkish characters are intentional

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"]
"backend/database_adapters/**" = ["S608"]  # identifiers are quoted; values never interpolated
"backend/api/**" = ["B008"]  # FastAPI dependency injection idiom

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["backend"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["backend.api.*"]
disallow_untyped_decorators = false
