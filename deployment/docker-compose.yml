# TRSQL On-Premises Docker Compose (ADR-0002 Offline-First + KVKK)
# Run from the repository root so relative mounts resolve accurately:
#   docker compose --project-directory . -f deployment/docker-compose.yml up -d
#
# Required environment variables (set in .env, never commit secrets):
#   POSTGRES_PASSWORD, TRSQL_PG_DSN, TRSQL_MODEL_PATH

name: trsql-onprem

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TRSQL_PG_DB:-trsql}
      POSTGRES_USER: ${TRSQL_PG_USER:-trsql_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ortam degiskeni .env icinde tanimlanmalidir}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Mounts ./deployment/postgres/*.sql initialization scripts (roles, RLS, masking, pgaudit) read-only.
      - ./deployment/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRSQL_PG_USER:-trsql_admin} -d ${TRSQL_PG_DB:-trsql}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - trsql_internal
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRSQL_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TRSQL_PG_DSN: ${TRSQL_PG_DSN:?TRSQL_PG_DSN ortam degiskeni .env icinde tanimlanmalidir}
      TRSQL_MODEL_PATH: ${TRSQL_MODEL_PATH:-/app/models/model.gguf}
      TRSQL_EMBEDDING_MODEL_PATH: ${TRSQL_EMBEDDING_MODEL_PATH:-/app/models/bge-m3.gguf}
      TRSQL_MODEL_DIR: /app/models
      TRSQL_AUDIT_LOG_DIR: /app/logs
      # KVKK 6698 audit log retention and masking policy settings
      TRSQL_LOG_RETENTION_DAYS: ${TRSQL_LOG_RETENTION_DAYS:-180}
      TRSQL_LOG_ARCHIVE_AFTER_DAYS: ${TRSQL_LOG_ARCHIVE_AFTER_DAYS:-30}
      TRSQL_LOG_PURGE_MODE: ${TRSQL_LOG_PURGE_MODE:-anonymize}
      TRSQL_KVKK_PII_MASKING: "1"
    volumes:
      # Local GGUF / safetensors model weights mounted strictly read-only (no runtime downloads).
      - ./models:/app/models:ro
      - trsql_logs:/app/logs
    ports:
      - "127.0.0.1:${TRSQL_API_PORT:-8000}:8000"
    networks:
      - trsql_internal
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TRSQL_API_UPSTREAM: http://api:8000
    ports:
      - "127.0.0.1:${TRSQL_FRONTEND_PORT:-3000}:80"
    networks:
      - trsql_internal
    security_opt:
      - no-new-privileges:true

volumes:
  pg_data:
  trsql_logs:

networks:
  trsql_internal:
    driver: bridge
